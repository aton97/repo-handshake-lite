name: Pro pilot interest
about: Apply to test Repo Handshake Pro during the validation pilot
title: "[Pro Pilot] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in testing Repo Handshake Pro. The pilot is for freelance developers, consultants, and small software studios that deliver client work through GitHub.
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options:
        - Freelance developer
        - Consultant
        - Small software studio
        - Other
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: How do you currently manage client delivery?
      description: Briefly describe how you handle scope, GitHub delivery, weekly updates, and client-requested changes.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Pilot expectations
      options:
        - label: I can test the workflow with non-sensitive or fictional client data and share feedback about setup friction and usefulness.
          required: true

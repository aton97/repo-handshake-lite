name: Repo Handshake weekly delivery summary

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Comment merged PRs from the last 7 days
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = new Date();
            const since = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            const issueTitle = 'Repo Handshake — weekly delivery log';

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 100
            });

            const merged = prs
              .filter(pr => pr.merged_at && new Date(pr.merged_at) >= since)
              .sort((a, b) => new Date(a.merged_at) - new Date(b.merged_at));

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100
            });

            let logIssue = issues.find(i => !i.pull_request && i.title === issueTitle);
            if (!logIssue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body: 'Weekly delivery summaries generated by Repo Handshake. This issue is intentionally long-lived.'
              });
              logIssue = created.data;
            }

            const start = since.toISOString().slice(0, 10);
            const end = now.toISOString().slice(0, 10);
            let body = `## Weekly delivery summary — ${start} to ${end}\n\n`;

            if (merged.length === 0) {
              body += 'No pull requests were merged in the last seven days.\n';
            } else {
              body += 'Merged pull requests:\n\n';
              for (const pr of merged) {
                body += `- #${pr.number} ${pr.title} — merged ${pr.merged_at.slice(0, 10)} by @${pr.user.login}\n`;
              }
            }

            body += '\n_Copy this list into your client update and rewrite it in client-facing language. Add blockers, decisions needed, and next week manually._';

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: logIssue.number,
              body
            });

            core.summary.addHeading('Repo Handshake weekly summary');
            core.summary.addRaw(`${merged.length} merged PR(s) found. Log issue: #${logIssue.number}`);
            await core.summary.write();
